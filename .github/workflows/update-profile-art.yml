name: Update profile art

# Refreshes the contribution graph SVG daily from real data.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours (4 times a day) to avoid rate limits
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Generate Rocket Shooting Game Animation
        run: python scripts/generate_rocket_game.py

      - name: Render animated contribution graph SVG
        run: python scripts/generate_streak_svg.py davidsanchez19 svgs/contrib-heatmap.svg

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "README.md data/contributions.json svgs/contrib-heatmap.svg svgs/rocket-shooting-game.svg"
